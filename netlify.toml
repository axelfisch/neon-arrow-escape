# Neon Arrow — Netlify
# Rebuild from source on each deploy so fixes reach the published app.

[build]
  publish = "site"
  command = "npm run build:netlify"
  environment = { NODE_VERSION = "22" }

[build.processing]
  skip_processing = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
